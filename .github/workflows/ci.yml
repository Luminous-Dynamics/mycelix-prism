name: CI

# Cancel stale, expensive Nix builds after a newer commit arrives for the same PR.
concurrency:
  group: prism-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main, 'ci/**', 'fix/**', 'security/**']

jobs:
  check:
    name: cargo check (Rust 1.99.0 · nix develop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed Cargo lockfile
        run: test -f Cargo.lock

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo check --workspace
        run: nix develop --command cargo check --workspace --locked

  test:
    name: cargo nextest (Rust 1.99.0 · nix develop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed Cargo lockfile
        run: test -f Cargo.lock

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo nextest run --workspace --locked
        run: nix develop --command cargo nextest run --workspace --locked

      - name: Run deterministic search-evaluation smoke test
        run: |
          set -o pipefail
          nix develop --command cargo run -p prism-search --bin evaluate_retrieval --locked | tee retrieval-evaluation.json

      - name: Upload retrieval-evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: prism-search-evaluation-${{ github.sha }}
          path: retrieval-evaluation.json
          if-no-files-found: error
          retention-days: 14

  msrv:
    name: MSRV check (Rust 1.96.1 · nix develop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed Cargo lockfile
        run: test -f Cargo.lock

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-msrv-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-msrv-${{ runner.os }}-

      - name: cargo check --workspace (compat shell)
        run: nix develop .#msrv --command cargo check --workspace --locked

  fmt:
    name: cargo fmt (Rust 1.99.0 · nix develop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix develop --command cargo fmt --all -- --check
