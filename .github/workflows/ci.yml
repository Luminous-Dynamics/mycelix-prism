name: CI

# Multiple documentation/code commits can otherwise leave stale expensive Nix
# builds queued for the same branch. Keep only the newest validation per PR/ref.
concurrency:
  group: prism-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: cargo check (Rust 1.99.0 · nix develop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Verify committed Cargo lockfile
        run: test -f Cargo.lock

      - name: cargo check --workspace
        run: nix develop --command cargo check --workspace --locked

  test:
    name: cargo nextest (Rust 1.99.0 · nix develop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Verify committed Cargo lockfile
        run: test -f Cargo.lock

      - name: cargo nextest run --workspace
        run: nix develop --command cargo nextest run --workspace --locked

  msrv:
    name: MSRV check (Rust 1.96.1 · nix develop .#msrv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-msrv-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-msrv-${{ runner.os }}-

      - name: Verify committed Cargo lockfile
        run: test -f Cargo.lock

      - name: cargo check --workspace (MSRV shell)
        run: nix develop .#msrv --command cargo check --workspace --locked
