name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  resolve-lockfile:
    name: Resolve and attest one Cargo.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /nix
          key: nix-lock-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-lock-${{ runner.os }}-

      - name: Generate or validate Cargo.lock and record provenance
        run: |
          set -euo pipefail
          if ! test -s Cargo.lock; then
            nix develop --command cargo generate-lockfile
          fi
          test -s Cargo.lock
          nix develop --command cargo metadata --locked --format-version 1 > /tmp/prism-cargo-metadata.json
          sha256sum Cargo.lock > Cargo.lock.sha256
          git rev-parse HEAD > source-head.txt
          python3 - <<'PY'
          import json
          import os
          with open('/tmp/prism-cargo-metadata.json', encoding='utf-8') as stream:
              metadata = json.load(stream)
          packages = metadata['packages']
          workspace = set(metadata['workspace_members'])
          git_sources = sorted({
              package['source'] for package in packages
              if (package.get('source') or '').startswith('git+')
          })
          registry_packages = [
              package for package in packages
              if (package.get('source') or '').startswith(('registry+', 'sparse+'))
          ]
          print(f"workspace_members={len(workspace)} resolved_packages={len(packages)} "
                f"registry_packages={len(registry_packages)} git_sources={len(git_sources)}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              with open('source-head.txt', encoding='utf-8') as head_file:
                  source_head = head_file.read().strip()
              with open('Cargo.lock.sha256', encoding='utf-8') as digest_file:
                  lock_digest = digest_file.read().split()[0]
              summary.write('## Exact-head Cargo.lock provenance\n\n')
              summary.write(f"- Source HEAD: `{source_head}`\n")
              summary.write(f"- Cargo.lock SHA-256: `{lock_digest}`\n")
              summary.write(f"- Workspace members: {len(workspace)}\n")
              summary.write(f"- Resolved packages: {len(packages)}\n")
              summary.write(f"- Registry packages: {len(registry_packages)}\n")
              summary.write(f"- Unique Git sources: {len(git_sources)}\n")
              summary.write('- This lockfile is an ephemeral runner artifact; CI does not commit it.\n')
          PY

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: prism-cargo-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Cargo.lock
            Cargo.lock.sha256
            source-head.txt
          if-no-files-found: error
          retention-days: 1

  security-regressions:
    name: Proxy log-redaction regression guard (Python stdlib)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test positive and negative redaction fixtures
        run: python3 scripts/test_proxy_log_redaction.py
      - name: Scan proxy and bridge log call sites
        run: python3 scripts/check_proxy_log_redaction.py

  check:
    needs: resolve-lockfile
    name: cargo check (Rust 1.99.0 · nix develop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Download and verify exact-head Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prism-cargo-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cargo-lock-artifact
      - name: Verify lockfile source and digest
        run: |
          set -euo pipefail
          test "$(cat .cargo-lock-artifact/source-head.txt)" = "$(git rev-parse HEAD)"
          (cd .cargo-lock-artifact && sha256sum -c Cargo.lock.sha256)
          install -m 0644 .cargo-lock-artifact/Cargo.lock Cargo.lock
          {
            echo "## Cargo.lock consumed by this job"
            echo "- Source HEAD: `$(git rev-parse HEAD)`"
            echo "- Cargo.lock SHA-256: `$(sha256sum Cargo.lock | cut -d ' ' -f1)`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo check --workspace
        run: nix develop --command cargo check --workspace --locked

  test:
    needs: resolve-lockfile
    name: cargo nextest (Rust 1.99.0 · nix develop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Download and verify exact-head Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prism-cargo-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cargo-lock-artifact
      - name: Verify lockfile source and digest
        run: |
          set -euo pipefail
          test "$(cat .cargo-lock-artifact/source-head.txt)" = "$(git rev-parse HEAD)"
          (cd .cargo-lock-artifact && sha256sum -c Cargo.lock.sha256)
          install -m 0644 .cargo-lock-artifact/Cargo.lock Cargo.lock
          {
            echo "## Cargo.lock consumed by this job"
            echo "- Source HEAD: `$(git rev-parse HEAD)`"
            echo "- Cargo.lock SHA-256: `$(sha256sum Cargo.lock | cut -d ' ' -f1)`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo nextest run --workspace --locked
        run: nix develop --command cargo nextest run --workspace --locked

  msrv:
    needs: resolve-lockfile
    name: MSRV check (Rust 1.96.1 · nix develop .#msrv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /nix
          key: nix-msrv-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-msrv-${{ runner.os }}-

      - name: Download and verify exact-head Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prism-cargo-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cargo-lock-artifact
      - name: Verify lockfile source and digest
        run: |
          set -euo pipefail
          test "$(cat .cargo-lock-artifact/source-head.txt)" = "$(git rev-parse HEAD)"
          (cd .cargo-lock-artifact && sha256sum -c Cargo.lock.sha256)
          install -m 0644 .cargo-lock-artifact/Cargo.lock Cargo.lock
          {
            echo "## Cargo.lock consumed by this job"
            echo "- Source HEAD: `$(git rev-parse HEAD)`"
            echo "- Cargo.lock SHA-256: `$(sha256sum Cargo.lock | cut -d ' ' -f1)`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cargo check --workspace (compat shell)
        run: nix develop .#msrv --command cargo check --workspace --locked
