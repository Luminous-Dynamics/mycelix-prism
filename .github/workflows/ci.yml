name: CI

# Least-privilege token baseline; the gated lock-recovery job declares its narrow write permissions.
permissions:
  contents: read

# Cancel superseded work for the same PR/ref; keep lock resolution tied to one source head.
concurrency:
  group: prism-ci-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main, fix/proxy-dns-pinning-redirects-20261010, 'security/**', 'hardening/**']
  pull_request:
    branches: [main, fix/proxy-dns-pinning-redirects-20261010, 'hardening/**']

jobs:
  workflow-policy:
    name: Workflow supply-chain policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test positive and negative policy fixtures
        run: python3 scripts/test_workflow_security.py
      - name: Scan all workflow YAML files
        run: python3 scripts/check_workflow_security.py

  security-regressions:
    name: Proxy log-redaction regression guard (Python stdlib)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test redaction positive and negative fixtures
        run: python3 scripts/test_proxy_log_redaction.py
      - name: Scan proxy and bridge log call sites
        run: python3 scripts/check_proxy_log_redaction.py

  # Narrow recovery/validation lane for PR #11. It resolves the lock from the
  # branch's current manifests, commits only Cargo.lock, then checks that same
  # working tree. The lock remains in a draft PR for human dependency review.
  generate_lockfile:
    name: Lockfile resolution and validation
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'fix/proxy-dns-pinning-redirects-20261010' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/fix/proxy-dns-pinning-redirects-20261010') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check whether Cargo.lock is missing
        id: lockfile
        run: |
          if test -s Cargo.lock; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /nix
          key: nix-lockfile-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-lockfile-${{ runner.os }}-

      - name: Generate lockfile from current workspace manifests
        if: steps.lockfile.outputs.missing == 'true'
        run: nix develop --command cargo generate-lockfile

      - name: Verify metadata and summarize dependencies
        run: |
          set -euo pipefail
          set -o pipefail
          nix develop --command cargo metadata --locked --format-version 1 | tail -n 1 > /tmp/prism-cargo-metadata.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/prism-cargo-metadata.json', encoding='utf-8') as stream:
              data = json.load(stream)
          packages = data['packages']
          workspace = set(data['workspace_members'])
          git_sources = sorted({p['source'] for p in packages if (p.get('source') or '').startswith('git+')})
          registry_packages = [p for p in packages if (p.get('source') or '').startswith(('registry+', 'sparse+'))]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Cargo dependency graph summary\n\n')
              out.write(f'- Workspace members: {len(workspace)}\n')
              out.write(f'- Resolved packages including workspace members: {len(packages)}\n')
              out.write(f'- Registry packages: {len(registry_packages)}\n')
              out.write(f'- Unique Git sources: {len(git_sources)}\n')
              for source in git_sources:
                  out.write(f'  - `{source}`\n')
              out.write('\nMetadata resolution is not a build or test result; inspect the lockfile diff before merge.\n')
          print(f"workspace_members={len(workspace)} resolved_packages={len(packages)} registry_packages={len(registry_packages)} git_sources={len(git_sources)}")
          PY
          git diff --check -- Cargo.lock

      - name: Commit generated lockfile to PR branch
        if: steps.lockfile.outputs.missing == 'true'
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --check
          git commit -m "build: lock standalone workspace dependencies"
          TOKEN_B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${TOKEN_B64}" push origin "HEAD:${BRANCH}"

      - name: Record exact tested revision
        run: |
          echo "Validation source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Cargo.lock SHA-256: $(sha256sum Cargo.lock | cut -d ' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: cargo check --workspace --locked
        id: workspace_check
        continue-on-error: true
        run: nix develop --command cargo check --workspace --locked

      - name: cargo nextest run --workspace --locked
        id: nextest
        continue-on-error: true
        run: nix develop --command cargo nextest run --workspace --locked

      - name: MSRV cargo check --workspace --locked
        id: msrv_check
        continue-on-error: true
        run: nix develop .#msrv --command cargo check --workspace --locked

      - name: Publish result for the exact validated commit
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_OUTCOME: ${{ steps.workspace_check.outcome }}
          NEXTEST_OUTCOME: ${{ steps.nextest.outcome }}
          MSRV_OUTCOME: ${{ steps.msrv_check.outcome }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$CHECK_OUTCOME" == success && "$NEXTEST_OUTCOME" == success && "$MSRV_OUTCOME" == success ]]; then
            STATE=success
            DESCRIPTION="locked check, Nextest, and MSRV passed on generated-lock commit"
          else
            STATE=failure
            DESCRIPTION="locked validation failed; inspect workflow summary"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context="prism/locked-validation" \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "Published prism/locked-validation=$STATE for $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Report validation outcomes
        if: ${{ always() }}
        env:
          CHECK_OUTCOME: ${{ steps.workspace_check.outcome }}
          NEXTEST_OUTCOME: ${{ steps.nextest.outcome }}
          MSRV_OUTCOME: ${{ steps.msrv_check.outcome }}
        run: |
          {
            echo '## Locked validation outcomes'
            echo "- cargo check: ${CHECK_OUTCOME}"
            echo "- nextest: ${NEXTEST_OUTCOME}"
            echo "- MSRV check: ${MSRV_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CHECK_OUTCOME" = success && test "$NEXTEST_OUTCOME" = success && test "$MSRV_OUTCOME" = success

    # rustfmt uses the light shell and does not require Cargo.lock.
  format:
    name: cargo fmt (Rust 1.99.0 · nix develop .#fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /nix
          key: nix-fmt-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-fmt-${{ runner.os }}-

      - name: Check Rust formatting
        run: nix develop .#fmt --command cargo fmt --all -- --check

  check:
    name: cargo check (Rust 1.99.0 · nix develop)
    if: ${{ !((github.event_name == 'pull_request' && github.head_ref == 'fix/proxy-dns-pinning-redirects-20261010' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/fix/proxy-dns-pinning-redirects-20261010')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify committed Cargo lockfile
        run: test -s Cargo.lock
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Nix store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-
      - name: Cache Cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo check --workspace --locked
        run: nix develop --command cargo check --workspace --locked

  test:
    name: cargo nextest (Rust 1.99.0 · nix develop)
    if: ${{ !((github.event_name == 'pull_request' && github.head_ref == 'fix/proxy-dns-pinning-redirects-20261010' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/fix/proxy-dns-pinning-redirects-20261010')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify committed Cargo lockfile
        run: test -s Cargo.lock
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Nix store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-
      - name: Cache Cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo nextest run --workspace --locked
        run: nix develop --command cargo nextest run --workspace --locked

  msrv:
    name: MSRV check (Rust 1.96.1 · nix develop .#msrv)
    if: ${{ !((github.event_name == 'pull_request' && github.head_ref == 'fix/proxy-dns-pinning-redirects-20261010' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/fix/proxy-dns-pinning-redirects-20261010')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify committed Cargo lockfile
        run: test -s Cargo.lock
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Nix store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /nix
          key: nix-msrv-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-msrv-${{ runner.os }}-
      - name: cargo check --workspace --locked (MSRV)
        run: nix develop .#msrv --command cargo check --workspace --locked
