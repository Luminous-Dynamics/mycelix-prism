name: CI

# Multiple documentation/code commits can otherwise leave stale expensive Nix
# builds queued for the same branch. Keep only the newest validation per PR/ref.
concurrency:
  group: prism-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Temporary, narrowly scoped recovery path for the known lockfile blocker.
  # It only writes Cargo.lock on this same-repository PR branch; the resulting
  # lock stays in the draft PR for dependency review before merge.
  generate_lockfile:
    name: Generate reviewed workspace lockfile
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/proxy-dns-pinning-redirects-20261010' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check whether Cargo.lock is missing
        id: lockfile
        run: |
          if test -s Cargo.lock; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.lockfile.outputs.missing == 'true'
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        if: steps.lockfile.outputs.missing == 'true'
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-lockfile-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-lockfile-${{ runner.os }}-

      - name: Generate Cargo.lock from the frozen branch manifests
        if: steps.lockfile.outputs.missing == 'true'
        run: nix develop --command cargo generate-lockfile

      - name: Verify and summarize resolved workspace graph
        if: steps.lockfile.outputs.missing == 'true'
        run: |
          set -euo pipefail
          nix develop --command cargo metadata --locked --format-version 1 > /tmp/prism-cargo-metadata.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/prism-cargo-metadata.json', encoding='utf-8'))
          packages = data['packages']
          workspace = set(data['workspace_members'])
          git_sources = sorted({p['source'] for p in packages if p.get('source', '').startswith('git+')})
          registry_packages = [p for p in packages if (p.get('source') or '').startswith('registry+') or (p.get('source') or '').startswith('sparse+') ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Generated Cargo.lock review summary\n\n')
              out.write(f'- Workspace members: {len(workspace)}\n')
              out.write(f'- Total resolved packages: {len(packages)}\n')
              out.write(f'- Registry packages: {len(registry_packages)}\n')
              out.write(f'- Git source identities: {len(git_sources)}\n')
              for source in git_sources:
                  out.write(f'  - `{source}`\n')
              out.write('\nThe generated lockfile is committed to the draft PR for dependency-by-dependency review; metadata resolution is not a compile/test result.\n')
          print(f"resolved_packages={len(packages)} workspace_members={len(workspace)} git_sources={len(git_sources)}")
          PY
          git diff --check -- Cargo.lock

      - name: Commit generated lockfile to draft PR branch
        if: steps.lockfile.outputs.missing == 'true'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --check
          git commit -m "build: lock standalone workspace dependencies"
          echo "Generated lock commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git push origin "HEAD:${BRANCH}"
  # Formatting has no Cargo.lock prerequisite, so it remains useful while the
  # locked dependency/build gates are explicitly blocked pending issue #3.
  format:
    name: cargo fmt (Rust 1.99.0 · nix develop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Check Rust formatting
        run: nix develop .#fmt --command cargo fmt --all -- --check

  check:
    name: cargo check (Rust 1.99.0 · nix develop)
    needs: generate_lockfile
    if: ${{ always() && (needs.generate_lockfile.result == 'success' || needs.generate_lockfile.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/proxy-dns-pinning-redirects-20261010' && github.head_ref || github.sha }}

      - name: Record tested source SHA
        run: echo "Checked out source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify committed Cargo lockfile
        run: test -f Cargo.lock

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo check --workspace
        run: nix develop --command cargo check --workspace --locked

  test:
    name: cargo nextest (Rust 1.99.0 · nix develop)
    needs: generate_lockfile
    if: ${{ always() && (needs.generate_lockfile.result == 'success' || needs.generate_lockfile.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/proxy-dns-pinning-redirects-20261010' && github.head_ref || github.sha }}

      - name: Record tested source SHA
        run: echo "Checked out source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify committed Cargo lockfile
        run: test -f Cargo.lock

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo nextest run --workspace
        run: nix develop --command cargo nextest run --workspace --locked

  msrv:
    name: MSRV check (Rust 1.96.1 · nix develop .#msrv)
    needs: generate_lockfile
    if: ${{ always() && (needs.generate_lockfile.result == 'success' || needs.generate_lockfile.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/proxy-dns-pinning-redirects-20261010' && github.head_ref || github.sha }}

      - name: Record tested source SHA
        run: echo "Checked out source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify committed Cargo lockfile
        run: test -f Cargo.lock

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-msrv-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-msrv-${{ runner.os }}-

      - name: cargo check --workspace (MSRV shell)
        run: nix develop .#msrv --command cargo check --workspace --locked
