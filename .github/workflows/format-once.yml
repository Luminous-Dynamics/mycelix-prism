name: One-shot workspace rustfmt

on:
  push:
    branches:
      - ci/run-rustfmt-proxy-controls-20261014
    paths:
      - '.github/workflows/format-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/ci/run-rustfmt-proxy-controls-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Apply configured workspace formatting
        run: nix develop .#fmt --command cargo fmt --all
      - name: Commit formatter output
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add prism-common/src/client_quota.rs prism-proxy/src/main.rs prism-proxy/src/quota_middleware.rs prism-safe-fetch/src/lib.rs prism-serve/src/main.rs prism-serve/src/quota_middleware.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply workspace rustfmt"
          TOKEN_B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${TOKEN_B64}" push origin "HEAD:${BRANCH}"
