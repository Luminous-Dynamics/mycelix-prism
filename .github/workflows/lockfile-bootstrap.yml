name: Temporary lockfile bootstrap

on:
  push:
    branches:
      - ci/restore-locked-validation-20261014
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  generate-lockfiles:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the controlled bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Pin Nix inputs
        run: nix flake lock
      - name: Generate the workspace Cargo lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: nix develop --command cargo generate-lockfile
      - name: Commit lockfiles to this controlled branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock flake.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Both lockfiles already match the committed source."
            exit 0
          fi
          git commit -m "build: pin Cargo and Nix dependency graphs"
          git push origin "HEAD:${BRANCH}"
